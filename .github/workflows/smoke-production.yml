name: Smoke production atlas API

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional production API base URL override
        required: false
        default: ""
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: read

concurrency:
  group: smoke-production-atlas
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_API_BASE_URL: ${{ github.event.inputs.base_url || vars.PRODUCTION_API_BASE_URL }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production smoke checks
        run: node ./scripts/smoke-atlas-api.mjs

      - name: Reconcile top-level Atlas amounts with source aggregates
        run: node ./scripts/reconcile-atlas-top-level.mjs
